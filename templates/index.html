<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Fake News Detection</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, Helvetica, sans-serif;
}

body{

height:100vh;
display:flex;
justify-content:center;
align-items:center;

background:linear-gradient(135deg,#4facfe,#00f2fe);

}

.container{

background:white;
width:700px;
padding:40px;
border-radius:20px;
box-shadow:0px 10px 30px rgba(0,0,0,0.2);
text-align:center;

}

h1{

color:#1e3a8a;
margin-bottom:10px;

}

p{

color:#555;
margin-bottom:25px;

}

textarea{

width:100%;
height:220px;

padding:15px;

font-size:17px;

border-radius:12px;

border:1px solid #ccc;

resize:none;

outline:none;

}

textarea:focus{

border:2px solid #2563eb;

}

button{

margin-top:20px;

padding:15px 35px;

background:#2563eb;

color:white;

border:none;

border-radius:10px;

font-size:18px;

cursor:pointer;

transition:0.3s;

}

button:hover{

background:#1d4ed8;

transform:scale(1.05);

}

.result{

margin-top:25px;

padding:15px;

font-size:22px;

font-weight:bold;

border-radius:10px;

background:#f3f4f6;

}

.footer{

margin-top:20px;

font-size:14px;

color:gray;

}

</style>

</head>

<body>

<div class="container">

<h1>📰 Fake News Detection System</h1>

<p>
Enter a news article below to check whether it is likely to be Fake or Real using Machine Learning.
</p>

<form method="POST">

<textarea
name="news"
placeholder="Paste your news article here..."
required></textarea>

<br>

<button type="submit">

Check News

</button>

</form>

{% if prediction %}

<div class="result">

{{ prediction }}

</div>

{% endif %}

<div class="footer">

Developed using Flask • Python • Machine Learning

</div>

</div>

</body>

</html>
